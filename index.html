<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client site — with tour engine wired in</title>

<!-- The client's own site styling goes here, untouched -->
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#F7F8FA;margin:0;color:#1F2430;}
  .topbar{padding:16px 24px;background:#fff;border-bottom:1px solid #E7E9EE;font-weight:700;}
  .body{padding:26px 24px;max-width:640px;}
  .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  .actions{display:flex;gap:10px;}
  .btn{font-size:13px;padding:9px 14px;border-radius:8px;border:1px solid #E1E4EA;background:#fff;color:#1F2430;cursor:pointer;}
  .btn.primary{background:#2FBF9F;color:#fff;border-color:#2FBF9F;font-weight:600;}
</style>

<!-- 1. The engine's own styling — self-contained, won't clash with the above -->
<link rel="stylesheet" href="dap-engine.css">
</head>
<body>

  <div class="topbar">Ledgerly</div>
  <div class="body">
    <div class="row">
      <h2>This month</h2>
      <div class="actions">
        <button class="btn" id="filter-btn">Filter</button>
        <button class="btn" id="export-btn">Export</button>
        <button class="btn primary" id="add-expense-btn">+ Add expense</button>
      </div>
    </div>
    <p>The rest of the client's real page content goes here as normal.</p>
    <p style="margin-top:20px;">
      <label style="display:block;font-size:13px;margin-bottom:6px;">Email for updates</label>
      <input id="signup-email" type="email" placeholder="you@company.com"
        style="padding:8px 10px;border:1px solid #E1E4EA;border-radius:6px;width:220px;">
    </p>
  </div>

  <!-- 2. The engine script -->
  <script src="dap-engine.js"></script>
  <script>
    // 3. Point it at this site's config and (once you have one) a
    //    /collect endpoint. Leave collectUrl out during development —
    //    events just log to the console until it's set.
    DAP.init({
      configUrl: 'tour-config.json',
      siteId: 'ledgerly-prod',
      tourId: 'onboarding-v1',
      collectUrl: '/api/collect'
    });
  </script>
</body>
</html>
